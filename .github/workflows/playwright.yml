name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    # Image officielle Playwright (Ubuntu 24.04) : les trois navigateurs et leurs dépendances système
    # y sont déjà. `npx playwright install --with-deps` téléchargeait ~180 paquets apt à chaque run,
    # et un miroir lent faisait dépasser la limite de 30 min avant le premier test.
    # Le tag doit suivre la version de @playwright/test dans package-lock.json (1.58.2).
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
      options: --user 1001
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
        cache: npm
    - name: Install dependencies
      run: npm ci
    # Le serveur de dev est lancé par Playwright (webServer dans playwright.config.ts).
    # Sans secrets Supabase, le site s'affiche sans actualités ni avis : les tests n'en dépendent pas.
    - name: Run Playwright tests
      run: npx playwright test
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 15
